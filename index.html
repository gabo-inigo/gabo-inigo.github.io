<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive geological weathering simulation — physical, chemical, and biological rock breakdown." />
  <title>Weathering Lab — Rock Breakdown Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main id="main">
    <section class="panel simulation simulation--physical" id="simulation" aria-label="Weathering simulation">
      <form class="controls" aria-label="Simulation parameters">
        <fieldset>
          <legend>Weathering type</legend>
          <div class="chip-group" role="radiogroup" aria-label="Weathering type">
            <label class="chip">
              <input type="radio" name="weatheringType" value="physical" checked />
              <span>Physical</span>
            </label>
            <label class="chip">
              <input type="radio" name="weatheringType" value="chemical" />
              <span>Chemical</span>
            </label>
            <label class="chip">
              <input type="radio" name="weatheringType" value="biological" />
              <span>Biological</span>
            </label>
          </div>
        </fieldset>

        <fieldset class="agent-panel" data-agents="physical">
          <legend>Mechanical agents</legend>
          <label class="range">
            <span class="range-label">Freeze–thaw cycles <output data-out="temp">55</output>%</span>
            <input type="range" name="temperature" min="0" max="100" value="55" />
          </label>
          <label class="range">
            <span class="range-label">Wind abrasion <output data-out="wind">45</output>%</span>
            <input type="range" name="wind" min="0" max="100" value="45" />
          </label>
          <label class="range">
            <span class="range-label">Rain → water in fractures <output data-out="rain-phys">35</output>%</span>
            <input type="range" name="rainfallPhys" min="0" max="100" value="35" />
          </label>
        </fieldset>

        <fieldset class="agent-panel is-hidden" data-agents="biological" hidden>
          <legend>Living agents</legend>
          <label class="range">
            <span class="range-label">Moisture (habitat) <output data-out="moisture-bio">60</output>%</span>
            <input type="range" name="moistureBio" min="0" max="100" value="60" />
          </label>
          <label class="range">
            <span class="range-label">Root & plant pressure <output data-out="roots">50</output>%</span>
            <input type="range" name="roots" min="0" max="100" value="50" />
          </label>
          <label class="range">
            <span class="range-label">Lichen & organic acids <output data-out="lichen">45</output>%</span>
            <input type="range" name="lichen" min="0" max="100" value="45" />
          </label>
        </fieldset>

        <fieldset class="agent-panel is-hidden" data-agents="chemical" hidden>
          <legend>Chemical agents</legend>
          <label class="range">
            <span class="range-label">Rainfall / moisture <output data-out="rain-chem">55</output>%</span>
            <input type="range" name="rainfallChem" min="0" max="100" value="55" />
          </label>
          <label class="range">
            <span class="range-label">Acidity (e.g. acid rain) <output data-out="acid">40</output>%</span>
            <input type="range" name="acidity" min="0" max="100" value="40" />
          </label>
          <label class="range">
            <span class="range-label">Temperature (reaction rate) <output data-out="temp-chem">30</output>%</span>
            <input type="range" name="temperatureChem" min="0" max="100" value="30" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Time</legend>
          <label class="range range-time">
            <span class="range-label">Elapsed time <output data-out="time">0</output> years</span>
            <input type="range" name="timeYears" min="0" max="3500" value="0" step="1" />
          </label>
          <div class="transport">
            <button type="button" class="btn btn-ghost" data-action="play" aria-pressed="false">
              <span class="play-label">Play</span>
            </button>
            <button type="button" class="btn btn-ghost" data-action="reset">Reset rock</button>
          </div>
        </fieldset>
      </form>

      <div class="stage-wrap">
        <canvas id="weatherCanvas" width="960" height="520" aria-label="Rock weathering visualization"></canvas>
        <div class="hud" aria-live="polite">
          <div class="hud-row">
            <span class="hud-key" data-hud="index-label">Breakdown index</span>
            <span class="hud-value" data-hud="index">0%</span>
          </div>
          <div class="hud-row">
            <span class="hud-key" data-hud="process-label">Active process</span>
            <span class="hud-value" data-hud="process">—</span>
          </div>
          <div class="hud-bar">
            <div class="hud-bar-fill hud-bar-fill--physical" data-hud="bar" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/simulation.js"></script>
</body>
</html>
